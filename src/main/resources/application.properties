spring.application.name=ultimo_coffee

# DATASOURCE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3306/ultimo_coffee_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA / HIBERNATE PROPERTIES
# Hibernate 6 (Spring Boot 3) automatically detects the best dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=TRACE
