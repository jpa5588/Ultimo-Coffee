<!DOCTYPE html>

<!-- Enables Thymeleaf's th: attributes. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <!-- Allows Bootstrap to adjust the layout for different screen sizes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Point of sale | Ultimo Coffee</title>

    <!-- Loads the same Bootstrap stylesheet used by menu.html. -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">

    <!-- Keeps the appearance consistent with menu management. -->
    <style>
        body {
            background-color: #f7f5ef;
        }

        .coffee-heading {
            font-family: Georgia, serif;
        }
    </style>
</head>

<body>

<!-- Bootstrap styles the navigation bar and adds a bottom border. -->
<header class="navbar bg-white border-bottom py-3">

    <!-- Uses the available width and adds horizontal padding. -->
    <div class="container-fluid px-4">

        <!-- "/" is handled by your existing PageController. -->
        <a class="navbar-brand fw-bold text-success"
           th:href="@{/}">
            ULTIMO COFFEE
        </a>

        <!-- d-flex and gap-2 arrange the navigation links beside each other. -->
        <nav class="d-flex gap-2" aria-label="Main navigation">

            <a class="btn btn-outline-success"
               th:href="@{/manage/menu}">
                Menu
            </a>

            <!-- The filled button identifies the current page. -->
            <a class="btn btn-success"
               th:href="@{/pos}"
               aria-current="page">
                POS
            </a>
        </nav>
    </div>
</header>

<!-- Centers the page content and adds vertical spacing. -->
<main class="container-xxl py-4">

    <div class="mb-4">

        <p class="small fw-semibold text-success mb-2">
            POINT OF SALE
        </p>

        <h1 class="display-6 coffee-heading">
            Available menu items.
        </h1>

        <p class="text-body-secondary">
            Browse the current items available to order.
        </p>
    </div>

    <!--
        Displays an empty-state message when the controller's list is empty.

        This includes the situation where items exist but are all unavailable.
    -->
    <div class="alert alert-info"
         th:if="${#lists.isEmpty(listMenuItems)}"
         role="status">

        No menu items are currently available.
        Add an item or mark an existing item as available in

        <a class="alert-link" th:href="@{/manage/menu}">
            menu management
        </a>.
    </div>

    <!--
        Starts a Bootstrap grid.
        g-3 adds spacing between the item cards.
    -->
    <div class="row g-3">

        <!--
            th:each repeats this column once for every saved menu item.

            listMenuItems is supplied by PosController.
            item represents the current MenuItem.

            Responsive widths:
            col-12: one card per row on the smallest screens.
            col-sm-6: two cards per row on small screens.
            col-lg-4: three cards per row on large screens.
            col-xl-3: four cards per row on extra-large screens.
        -->
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3"
             th:each="item : ${listMenuItems}">

            <!-- h-100 makes cards fill the height of their grid column. -->
            <article class="card h-100 shadow-sm">

                <!--
                    d-flex flex-column arranges the card contents vertically.
                    p-4 adds padding around them.
                -->
                <div class="card-body d-flex flex-column p-4">

                    <!-- Displays the category saved on this MenuItem. -->
                    <span class="badge text-bg-light border align-self-start mb-3"
                          th:text="${item.category}">
                    </span>

                    <!-- Displays the saved item name. -->
                    <h2 class="h5 card-title"
                        th:text="${item.name}">
                    </h2>

                    <!--
                        Displays the saved description.

                        th:if hides this paragraph when the description is empty.
                        th:text safely displays the description as text.
                    -->
                    <p class="card-text small text-body-secondary mb-4"
                       th:if="${!#strings.isEmpty(item.description)}"
                       th:text="${item.description}">
                    </p>

                    <!--
                        mt-auto pushes this section toward the bottom of the card.
                        border-top separates the price from the description.
                    -->
                    <div class="d-flex justify-content-between
                                align-items-end gap-2 mt-auto pt-3 border-top">

                        <div>

                            <div class="small text-body-secondary">
                                Base price
                            </div>

                            <!--
                                Reads the saved BigDecimal price.
                                Formats it with a dollar sign and two decimal places.
                            -->
                            <div class="fs-5 fw-semibold text-success"
                                 th:text="${'$' + #numbers.formatDecimal(
                                     item.price, 1, 'COMMA', 2, 'POINT')}">
                            </div>
                        </div>

                        <!-- Displays the item's saved tax setting. -->
                        <span class="small text-body-secondary"
                              th:text="${item.taxable
                                  ? 'Taxable: Yes'
                                  : 'Taxable: No'}">
                        </span>
                    </div>

                </div>
            </article>
        </div>

    </div>
</main>

</body>
</html>
